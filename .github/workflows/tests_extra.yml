name: extra tests

on:
  pull_request:
    branches:
      - main
      - "*x"
    # To trigger on label changes
    types:
      - synchronize
      - labeled
  schedule:
    # Weekly Monday midnight build
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: (github.repository == 'spacetelescope/stcal' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run extra tests')))
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@22ddf09dfabb443adddfb9f861b7d41a787d6b1a # v3.0.3
    with:
      envs: |
        - macos: py311-xdist
        - macos: py312-xdist
        - macos: py313-xdist
        - windows: py311-xdist
        - windows: py312-xdist
        - windows: py313-xdist
        - linux: py314-devdeps-xdist
        - macos: py314-devdeps-xdist
        # drizzle's git build uses absolute source paths, so the default TEMP pushes
        # MSVC object paths past the 260-character limit; use a shorter TEMP instead
        - windows: py314-devdeps-xdist
          setenv: |
            TEMP: C:\Windows\Temp
            TMP: C:\Windows\Temp
        - linux: py315-devdeps-xdist
          python-version: 3.15
        - windows: py315-devdeps-xdist
          python-version: 3.15
          setenv: |
            TEMP: C:\Windows\Temp
            TMP: C:\Windows\Temp
