name: build

on:
  release:
    types: [released]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    with:
      upload_to_pypi: ${{ (github.event_name == 'release') && (github.event.action == 'released') }}
      targets: |
        # Linux wheels
        - cp3*-manylinux_x86_64
        # Build natively on an Arm runner rather than under QEMU emulation
        - target: cp3*-manylinux_aarch64
          runs-on: ubuntu-24.04-arm
        # MacOS wheels
        # macos-latest runners are arm64: arm64 wheels are tested natively,
        # and x86_64 wheels are cross-compiled and tested under Rosetta 2
        - cp3*-macosx_x86_64
        - cp3*-macosx_arm64
        # Windows wheels
        # Windows ARM64 (cp3*-win_arm64) is not built until pyarrow publishes Windows ARM64 wheels
        - cp3*-win_amd64
      sdist: true
      test_command: python -c "from stcal.ramp_fitting.ols_cas22 import _ramp, _jump, _fit; from stcal.ramp_fitting import slope_fitter"
    secrets:
      pypi_token: ${{ secrets.PYPI_PASSWORD_STSCI_MAINTAINER }}
